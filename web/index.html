<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tokyo Events Map</title>
  <meta name="description" content="Every event happening in Tokyo, on a map. Filter by day, week, month or any range, and by type." />
  <meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e5452f'/%3E%3Ccircle cx='16' cy='14' r='5' fill='white'/%3E%3Cpath d='M16 27c-5-6-8-9.5-8-13a8 8 0 0 1 16 0c0 3.5-3 7-8 13z' fill='none' stroke='white' stroke-width='2.2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("te-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div id="map" aria-label="Map of events in Tokyo"></div>

  <aside class="panel" id="panel" data-sheet="half">
    <button class="sheet-handle" id="sheet-handle" aria-label="Expand or collapse the event list"><span></span></button>

    <!-- LIST VIEW -->
    <section class="view view-list" id="view-list">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><circle cx="16" cy="14" r="5" fill="currentColor"/><path d="M16 27c-5-6-8-9.5-8-13a8 8 0 0 1 16 0c0 3.5-3 7-8 13z" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
        </div>
        <div>
          <h1>Tokyo <em>happenings</em></h1>
          <p class="brand-sub" id="freshness">Loading…</p>
        </div>
      </header>

      <div class="controls">
        <div class="segmented" role="tablist" id="mode-tabs" aria-label="Date range">
          <span class="segmented-thumb" aria-hidden="true"></span>
          <button role="tab" data-mode="day">Day</button>
          <button role="tab" data-mode="week">Week</button>
          <button role="tab" data-mode="month">Month</button>
          <button role="tab" data-mode="custom">Custom</button>
        </div>

        <div class="navigator" id="navigator">
          <button class="icon-btn" id="prev" aria-label="Previous period" title="Previous (←)">
            <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button class="nav-label" id="nav-label" title="Pick a date">
            <span id="range-label">—</span>
            <input type="date" id="anchor-input" aria-label="Pick a date" />
          </button>
          <button class="icon-btn" id="next" aria-label="Next period" title="Next (→)">
            <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button class="pill-btn" id="today-btn">Today</button>
        </div>

        <div class="custom-range" id="custom-range" hidden>
          <label><span>From</span><input type="date" id="from-input" /></label>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <label><span>To</span><input type="date" id="to-input" /></label>
        </div>

        <div class="density" id="density" aria-label="Events per day"></div>

        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="search" placeholder="Search events, venues, areas" autocomplete="off" />
          <kbd>/</kbd>
        </label>

        <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
      </div>

      <div class="results-bar">
        <p id="result-count" aria-live="polite">&nbsp;</p>
        <label class="toggle" title="Only list events visible on the map">
          <input type="checkbox" id="in-view" />
          <span class="toggle-track"><span></span></span>
          In map view
        </label>
      </div>

      <div class="list" id="list" role="list"></div>
    </section>

    <!-- DETAIL VIEW -->
    <section class="view view-detail" id="view-detail" hidden>
      <div class="detail-top">
        <button class="pill-btn back" id="back-btn">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg> All events
        </button>
      </div>
      <article class="detail" id="detail"></article>
    </section>
  </aside>

  <div class="map-actions">
    <button class="glass-btn" id="locate-btn" aria-label="Recenter on Tokyo" title="Recenter on Tokyo">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <button class="glass-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle theme">
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <template id="tpl-card">
    <article class="card" role="listitem" tabindex="0">
      <div class="card-thumb"><img alt="" loading="lazy" decoding="async" /></div>
      <div class="card-body">
        <div class="card-kicker"></div>
        <h3 class="card-title"></h3>
        <p class="card-meta"></p>
      </div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
